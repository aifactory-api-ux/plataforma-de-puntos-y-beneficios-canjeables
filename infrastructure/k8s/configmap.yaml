apiVersion: v1
kind: ConfigMap
metadata:
  name: plataforma-puntos-config
  namespace: plataforma-puntos
data:
  NODE_ENV: "production"
  PORT: "3000"
  APP_VERSION: "1.0.0"
  DB_NAME: "puntos_db"
  DB_SYNCHRONIZE: "false"
  DB_LOGGING: "false"
  REDIS_DB: "0"
  CORS_ORIGIN: "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: plataforma-puntos-secrets
  namespace: plataforma-puntos
type: Opaque
stringData:
  DB_USERNAME: "postgres"
  DB_PASSWORD: "postgres"
  REDIS_PASSWORD: ""
