  /exportaciones/movimientos:
    get:
      operationId: get_exportaciones_movimientos
      parameters:
        - name: cliente_id
          in: query
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: ['csv']
        - name: fecha_desde
          in: query
          required: false
          schema:
            type: string
        - name: fecha_hasta
          in: query
          required: false
          schema:
            type: string
        - name: tipo_movimiento
          in: query
          required: false
          schema:
            type: string
            enum: ['ACUMULACION', 'CANJE', 'VENCIMIENTO', 'AJUSTE', 'DEVOLUCION']
      responses:
        '200':
          description: Archivo CSV con movimientos de puntos
          content:
            text/csv:
              schema:
                type: string
                example: "movimiento_id,cuenta_id,tipo_movimiento,cantidad,fecha_movimiento,origen,regla_aplicada_id\n..."
